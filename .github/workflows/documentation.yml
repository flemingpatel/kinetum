name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv doxygen openjdk-21-jre-headless graphviz \
            fonts-dejavu-core ca-certificates curl
          printf '%s\n' '/usr/lib/jvm/java-21-openjdk-amd64/bin' >> "$GITHUB_PATH"

      - name: Build and verify website
        run: |
          /usr/bin/python3 -I -B tooling/release/documentation/build_documentation.py
          /usr/bin/python3 -I -B tooling/release/documentation/build_documentation.py --verify-only

      - name: Archive the complete website
        # The site's manifest includes .buildinfo and every other verified file.
        run: |
          tar --dereference --hard-dereference \
            --directory build/docs/html \
            --create --file "$RUNNER_TEMP/artifact.tar" .

      - name: Upload website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
