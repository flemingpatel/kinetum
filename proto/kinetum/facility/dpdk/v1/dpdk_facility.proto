// Pure configuration contract for the current DPDK process facility.

syntax = "proto3";

package kinetum.facility.dpdk.v1;

option cc_enable_arenas = true;

// DpdkFacilityConfig selects the one exact current DPDK facility policy.
// Empty is a complete policy: worker/service ownership, devices, memory, NUMA,
// and deterministic EAL arguments come from compiled plan and host facts. It
// does not mean infer defaults and is not an escaped command-line surface.
message DpdkFacilityConfig {}
