// Pure configuration contract for host packet storage.

syntax = "proto3";

package kinetum.storage.host.v1;

option cc_enable_arenas = true;

// HostStorageConfig selects the one exact current host-storage policy. Empty
// is complete policy, not permission to infer capacity, NUMA, or allocation;
// those facts come from the compiled plan and materialized storage domain.
message HostStorageConfig {}
