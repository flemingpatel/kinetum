// Pure configuration contract for CPU-bounded storage transitions.

syntax = "proto3";

package kinetum.transition.cpu.v1;

option cc_enable_arenas = true;

// BoundedCopyConfig selects the one exact current CPU copy policy. Empty is
// complete policy; copy capacity and staging NUMA placement are required
// compiled-plan facts rather than defaults hidden in this payload.
message BoundedCopyConfig {}
